<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-150 -150 300 300" role="img" aria-label="Fleur-spirale cosmique">
  <style>
    .turn { transform-box: fill-box; transform-origin: center; animation: turn 140s linear infinite; }
    .turn-rev { transform-box: fill-box; transform-origin: center; animation: turn 220s linear infinite reverse; }
    .twinkle { animation: twinkle 5s ease-in-out infinite; }
    .twinkle.d2 { animation-delay: -2.5s; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes twinkle { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .turn, .turn-rev, .twinkle { animation: none; } }
  </style>
  <defs>
    <linearGradient id="iri" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F5D5C5"/>
      <stop offset=".5" stop-color="#CDBFE8"/>
      <stop offset="1" stop-color="#BFD8CC"/>
    </linearGradient>
    <linearGradient id="iri-soft" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FBE9E1"/>
      <stop offset="1" stop-color="#E3D9F3"/>
    </linearGradient>
    <linearGradient id="ribbon-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CDBFE8"/>
      <stop offset=".5" stop-color="#BFD8CC"/>
      <stop offset="1" stop-color="#EBC8D6"/>
    </linearGradient>
    <path id="petal" d="M0,-8 C17,-26 20,-60 7,-86 C-6,-70 -19,-44 -9,-20 C-6,-14 -3,-10 0,-8Z"/>
    <path id="petal-in" d="M0,-6 C11,-18 14,-40 4,-58 C-4,-46 -12,-30 -5,-14Z"/>
    <path id="vein" d="M0,-10 C4,-30 6,-56 5,-80"/>
    <path id="ribbon" d="M10,-40 C50,-66 98,-42 114,2 C124,32 114,62 92,84"/>
    <path id="star" d="M0,-9 Q1.4,-1.4 9,0 Q1.4,1.4 0,9 Q-1.4,1.4 -9,0 Q-1.4,-1.4 0,-9Z"/>
    <path id="crescent" d="M-15,0 A15,15 0 0 0 15,0 A13,9 0 0 1 -15,0Z"/>
  </defs>

  <!-- Orbites -->
  <g fill="none" stroke="#C8A57E" stroke-linecap="round">
    <circle r="108" stroke-width="1"/>
    <circle r="96" stroke-width="2.4" stroke-dasharray="0.1 8" opacity=".7"/>
    <line y1="-112" y2="-96" stroke-width="2.4" stroke-dasharray="0.1 5"/>
    <line y1="96" y2="114" stroke-width="2.4" stroke-dasharray="0.1 5"/>
    <line x1="-126" x2="-112" stroke-width="2" stroke-dasharray="0.1 4.5"/>
    <line x1="112" x2="126" stroke-width="2" stroke-dasharray="0.1 4.5"/>
  </g>

  <!-- Rubans en mouvement -->
  <g class="turn-rev" fill="none" stroke-linecap="round">
    <circle r="125" fill="none" stroke="none"/>
    <use href="#ribbon" xlink:href="#ribbon" stroke="url(#ribbon-grad)" stroke-width="5" opacity=".75"/>
    <use href="#ribbon" xlink:href="#ribbon" transform="rotate(180)" stroke="url(#ribbon-grad)" stroke-width="5" opacity=".75"/>
    <use href="#ribbon" xlink:href="#ribbon" transform="rotate(90) scale(.8)" stroke="#BFD8CC" stroke-width="2" opacity=".8"/>
    <use href="#ribbon" xlink:href="#ribbon" transform="rotate(270) scale(.8)" stroke="#EBC8D6" stroke-width="2" opacity=".8"/>
  </g>

  <!-- Fleur -->
  <g class="turn">
    <circle r="90" fill="none" stroke="none"/>
    <g fill="url(#iri)" stroke="#A992CF" stroke-width=".7" stroke-linejoin="round">
      <use href="#petal" xlink:href="#petal"/>
      <use href="#petal" xlink:href="#petal" transform="rotate(45)"/>
      <use href="#petal" xlink:href="#petal" transform="rotate(90)"/>
      <use href="#petal" xlink:href="#petal" transform="rotate(135)"/>
      <use href="#petal" xlink:href="#petal" transform="rotate(180)"/>
      <use href="#petal" xlink:href="#petal" transform="rotate(225)"/>
      <use href="#petal" xlink:href="#petal" transform="rotate(270)"/>
      <use href="#petal" xlink:href="#petal" transform="rotate(315)"/>
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-width=".8" opacity=".7">
      <use href="#vein" xlink:href="#vein"/>
      <use href="#vein" xlink:href="#vein" transform="rotate(45)"/>
      <use href="#vein" xlink:href="#vein" transform="rotate(90)"/>
      <use href="#vein" xlink:href="#vein" transform="rotate(135)"/>
      <use href="#vein" xlink:href="#vein" transform="rotate(180)"/>
      <use href="#vein" xlink:href="#vein" transform="rotate(225)"/>
      <use href="#vein" xlink:href="#vein" transform="rotate(270)"/>
      <use href="#vein" xlink:href="#vein" transform="rotate(315)"/>
    </g>
    <g fill="url(#iri-soft)" stroke="#C8A57E" stroke-width=".6">
      <use href="#petal-in" xlink:href="#petal-in" transform="rotate(22.5)"/>
      <use href="#petal-in" xlink:href="#petal-in" transform="rotate(67.5)"/>
      <use href="#petal-in" xlink:href="#petal-in" transform="rotate(112.5)"/>
      <use href="#petal-in" xlink:href="#petal-in" transform="rotate(157.5)"/>
      <use href="#petal-in" xlink:href="#petal-in" transform="rotate(202.5)"/>
      <use href="#petal-in" xlink:href="#petal-in" transform="rotate(247.5)"/>
      <use href="#petal-in" xlink:href="#petal-in" transform="rotate(292.5)"/>
      <use href="#petal-in" xlink:href="#petal-in" transform="rotate(337.5)"/>
    </g>
    <circle r="15" fill="#FFF8F1" stroke="#C8A57E" stroke-width=".8"/>
    <path d="M0,0 a1.5,1.5 0 0 1 3,0 a3,3 0 0 1 -6,0 a4.5,4.5 0 0 1 9,0 a6,6 0 0 1 -12,0 a7.5,7.5 0 0 1 15,0" transform="translate(-1.5 0)" fill="none" stroke="#8E7BB8" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- Lunes et étoiles -->
  <g fill="#F1E3D3" stroke="#C8A57E" stroke-width=".8">
    <use href="#crescent" xlink:href="#crescent" transform="translate(0 -122)"/>
    <use href="#crescent" xlink:href="#crescent" transform="translate(0 124) rotate(180)"/>
  </g>
  <g fill="#C8A57E">
    <use class="twinkle" href="#star" xlink:href="#star" transform="translate(0 -138) scale(.9)"/>
    <use class="twinkle d2" href="#star" xlink:href="#star" transform="translate(0 141) scale(1.1)"/>
    <use class="twinkle d2" href="#star" xlink:href="#star" transform="translate(-136 0) scale(1.2)"/>
    <use class="twinkle" href="#star" xlink:href="#star" transform="translate(136 0) scale(1.2)"/>
  </g>
</svg>
